[package]
name = "openplantrace-model-eval"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "BSD-2-Clause"
description = "Native Rust evaluation of OPT's trained source-image crop classifier"

[dependencies]
openplantrace-rs = { path = "..", default-features = false, features = ["onnx"] }
openplantrace-symbol-data = { path = "../symbol-data" }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[profile.release]
debug = "line-tables-only"
