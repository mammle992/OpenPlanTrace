[package]
name = "openplantrace-viewer"
version = "0.12.32-alpha.20"
edition = "2024"
rust-version = "1.99"
license = "BSD-2-Clause"
publish = false

[dependencies]
openplantrace-rs = { path = "..", default-features = false }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "multipart", "query", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
